[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phi-rds"
version = "0.1.0"
description = "Phi RDS — Robot dataset model & I/O SDK (RobotDataSet, Episode, semantics, stats)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyarrow>=14.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
lerobot = ["lerobot>=0.4.0"]
robots = ["kinpy>=0.2"]
dev = [
    "pytest>=7.0",
    "ruff",
    "phi-rds[lerobot,robots]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phi_rds = ["py.typed"]
